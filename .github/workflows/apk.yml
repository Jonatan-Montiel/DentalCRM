name: APK
# Compila la app de Android en la nube de GitHub cada vez que subes cambios a main.
# Descarga: Releases > "DentalCRM (Android)"  o  https://jonatan-montiel.github.io/DentalCRM/dl/dentalcrm.apk
on:
  push:
    branches: [main]
    paths-ignore: ['dl/**', 'supabase/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar llave de firma (desde los secretos)
        env:
          DC_SIGN: ${{ secrets.DC_SIGN }}
        run: |
          if [ -z "$DC_SIGN" ]; then echo "::error::Falta el secreto DC_SIGN (Settings > Secrets and variables > Actions)"; exit 1; fi
          P="${DC_SIGN%%:*}"; echo "::add-mask::$P"
          printf %s "${DC_SIGN#*:}" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dc.jks"
          echo "DC_KEY_PASS=$P" >> "$GITHUB_ENV"
      - name: Incluir la app web en el APK (para usarla sin conexión)
        run: |
          W=android/app/src/main/assets/www; rm -rf "$W"; mkdir -p "$W"
          cp -r index.html manifest.webmanifest sw.js css js icons "$W"/
      - name: Construir APK
        working-directory: android
        env:
          VC: ${{ github.run_number }}
          DC_KS: ${{ runner.temp }}/dc.jks
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk dentalcrm.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: DentalCRM (Android)
          body: "App de Android de DentalCRM 🦷 (vc=${{ github.run_number }})"
          files: dentalcrm.apk
          make_latest: true
      - name: Publicar copia para descargar desde la página (dl/)
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main && git checkout -q -B pub origin/main
          mkdir -p dl && cp dentalcrm.apk dl/ && echo '{"vc":${{ github.run_number }}}' > dl/version.json
          git add dl && git commit -qm "App v${{ github.run_number }} lista para descargar"
          for i in 1 2 3 4; do git push -q origin pub:main && break; sleep 5; git fetch -q origin main && git rebase -q origin/main; done
          git checkout -q ${{ github.sha }}
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test-emulador.sh
      - name: Borrar llave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/dc.jks"
      - name: Guardar resultado de la prueba
        if: always()
        run: |
          mkdir -p /tmp/out && cp android/build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b apk-log && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "prueba ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-log
