plugins { id 'com.android.application' }
android {
  namespace 'mx.dentalcrm.app'
  compileSdk 34
  defaultConfig {
    applicationId 'mx.dentalcrm.app'
    minSdk 24
    targetSdk 34
    versionCode Integer.parseInt(System.getenv('VC') ?: '1')
    versionName '1.' + (System.getenv('VC') ?: '1')
    resValue 'string', 'app_name', 'DentalCRM'
  }
  signingConfigs {
    // La llave vive SOLO en los secretos de GitHub (DC_SIGN); nunca en el repo
    rel { storeFile file(System.getenv('DC_KS') ?: 'sin-llave.jks'); storePassword System.getenv('DC_KEY_PASS') ?: ''; keyAlias 'dc'; keyPassword System.getenv('DC_KEY_PASS') ?: '' }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.rel } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
  // Sirve la copia de la app incluida en el APK (sin conexión) con un origen https fijo
  implementation 'androidx.webkit:webkit:1.11.0'
}
